name: Run Unit Tests

on:
  push:
    # ==================================================================
    # ENHANCEMENT 1 (Branch filter)
    # Only pushes to the main branch trigger tests.
    # Pushes to other branches (unfinished work) are skipped.
    # ==================================================================
    branches: [main]

    # ==================================================================
    # ENHANCEMENT 2 (Paths filter)
    # Only run when a file that can affect the test results changes.
    # Changes to docs or notes (e.g. notes.txt) are skipped.
    # ==================================================================
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/run-tests.yml"

  # ====================================================================
  # ENHANCEMENT 1 (Pull request trigger)
  # Also run tests when a pull request into main is opened or updated,
  # so code is tested at the review stage, before it is merged.
  # The same paths filter (Enhancement 2) applies here.
  # ====================================================================
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/run-tests.yml"

  # ====================================================================
  # EXTRA (Manual trigger, not an enhancement)
  # Adds a "Run workflow" button in the Actions tab.
  # ====================================================================
  workflow_dispatch:

# ======================================================================
# ENHANCEMENT 3 (Concurrency)
# Runs on the same branch share one group. If a new run starts while
# an older one is still in progress, the older run is cancelled,
# so only the newest commit is tested.
# ======================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ======================================================================
# JOB (unchanged from the basic workflow)
# Fresh runner: checkout code, set up Python, install packages, run pytest
# ======================================================================
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing