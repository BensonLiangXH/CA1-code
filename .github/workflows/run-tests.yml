name: Run Unit Tests                           # Workflow name shown in the Actions tab

on:                                            # TRIGGERS: when the workflow runs
  push:                                        # Run when code is pushed...
    branches: [main]                           # ENHANCEMENT 1: ...but only pushes to main (other branches skipped)
    paths:                                     # ENHANCEMENT 2: ...and only if one of these files changed
      - "src/**"                               #   source code
      - "tests/**"                             #   test files
      - "requirements.txt"                     #   installed packages
      - ".github/workflows/run-tests.yml"      #   this workflow file
                                               #   (anything else, e.g. notes.txt, does NOT trigger a run)

  pull_request:                                # ENHANCEMENT 1: also run when a pull request is opened/updated...
    branches: [main]                           # ENHANCEMENT 1: ...but only pull requests into main (tested before merging)
    paths:                                     # ENHANCEMENT 2: same paths filter for pull requests
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/run-tests.yml"

  workflow_dispatch:                           # EXTRA: adds a manual "Run workflow" button (not an enhancement)

concurrency:                                   # ENHANCEMENT 3: control runs that overlap
  group: ${{ github.workflow }}-${{ github.ref }}  # Runs of this workflow on the same branch share one group
  cancel-in-progress: true                     # A newer run cancels the older one still in progress

jobs:                                          # JOB: unchanged from the basic workflow
  test:                                        # Job name
    runs-on: ubuntu-latest                     # Fresh Linux machine (runner) every time

    steps:                                     # Steps run from top to bottom
      - name: Check out repository code
        uses: actions/checkout@v4              # 1. Download the repo code onto the runner

      - name: Set up Python
        uses: actions/setup-python@v5          # 2. Install Python
        with:
          python-version: "3.12"               #    Python version to use

      - name: Install dependencies             # 3. Install pytest and pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage         # 4. Run all tests and show coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing
